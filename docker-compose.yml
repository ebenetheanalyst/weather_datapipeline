x-airflow-common:
  &airflow-common

  build:
    context: .
    dockerfile: Dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow

    AIRFLOW__CORE__FERNET_KEY: ""

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth

    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}

    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    TZ: ${TZ}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config_project
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID}:0"

  depends_on:
    postgres:
      condition: service_healthy


services:

  postgres:

    image: postgres:16

    container_name: weather_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:

    image: dpage/pgadmin4:latest

    container_name: weather_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy


  airflow-init:

    <<: *airflow-common

    container_name: weather_airflow_init

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Weather \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true

        airflow connections add weather_postgres \
          --conn-type postgres \
          --conn-host postgres \
          --conn-port 5432 \
          --conn-login ${POSTGRES_USER} \
          --conn-password ${POSTGRES_PASSWORD} \
          --conn-schema ${POSTGRES_DB} || true

    restart: "no"


  airflow-api-server:

    <<: *airflow-common

    container_name: weather_airflow_api

    command:
      - api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:

    <<: *airflow-common

    container_name: weather_airflow_scheduler

    command:
      - scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:

    <<: *airflow-common

    container_name: weather_airflow_dag_processor

    command:
      - dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-triggerer:

    <<: *airflow-common

    container_name: weather_airflow_triggerer

    command:
      - triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  metabase:

    image: metabase/metabase:latest

    container_name: weather_metabase

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_password
      MB_DB_HOST: metabase-db

    depends_on:
      metabase-db:
        condition: service_healthy


  metabase-db:

    image: postgres:16

    container_name: weather_metabase_db

    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_password
      POSTGRES_DB: metabase

    volumes:
      - metabase_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metabase -d metabase"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  postgres_data:

  metabase_data: 